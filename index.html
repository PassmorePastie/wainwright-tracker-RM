<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wainwright Bagger — Live UI Concepts</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F4EFEB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4EFEB; color: #1E2A38; }
        h1, h2, h3, h4, .brand-font { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #EAE3DC; }
        ::-webkit-scrollbar-thumb { background: #1E2A38; border-radius: 4px; }

        .leaflet-control-custom-panel {
            background-color: #FFFBF7;
            color: #1E2A38;
            border: 2px solid #1E2A38;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(30, 42, 56, 0.15);
            overflow: hidden;
        }

        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid #FFFBF7;
        }
        .pin-bagged { background-color: #5B7B7A; }
        .pin-near { background-color: #D49B53; }
        .pin-planned { background-color: #9333ea; }
        .pin-unvisited { background-color: #94a3b8; opacity: 0.8; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-[#F4EFEB]">

    <!-- LIVE UI CONCEPT SWITCHER HEADER -->
    <header id="concept-switcher-header" class="bg-[#1E2A38] text-[#F4EFEB] p-3 flex flex-wrap items-center justify-between border-b-2 border-amber-500/50 z-50 flex-shrink-0 shadow-lg transition-all duration-300">
        <div class="flex items-center gap-2 mb-2 md:mb-0">
            <i class="fa-solid fa-palette text-amber-400"></i>
            <span class="font-black brand-font text-xs uppercase tracking-wider">LIVE UI CONCEPTS</span>
            <span class="text-[10px] bg-amber-500 text-black px-1.5 py-0.5 rounded font-mono font-bold">v1.5.0</span>
        </div>
        
        <div class="flex items-center gap-1.5 overflow-x-auto py-1 text-xs">
            <button onclick="setUIConcept(1)" id="btn-concept-1" class="px-3 py-1 rounded-lg font-bold bg-amber-500 text-black transition shadow-sm">Option 1: Top-Bar</button>
            <button onclick="setUIConcept(2)" id="btn-concept-2" class="px-3 py-1 rounded-lg font-bold bg-[#FAF7F2]/10 hover:bg-[#FAF7F2]/20 text-[#F4EFEB] transition">Option 2: Drawer</button>
            <button onclick="setUIConcept(3)" id="btn-concept-3" class="px-3 py-1 rounded-lg font-bold bg-[#FAF7F2]/10 hover:bg-[#FAF7F2]/20 text-[#F4EFEB] transition">Option 3: Grid</button>
            <button onclick="setUIConcept(4)" id="btn-concept-4" class="px-3 py-1 rounded-lg font-bold bg-[#FAF7F2]/10 hover:bg-[#FAF7F2]/20 text-[#F4EFEB] transition">Option 4: Heritage</button>
            <button onclick="setUIConcept(5)" id="btn-concept-5" class="px-3 py-1 rounded-lg font-bold bg-[#FAF7F2]/10 hover:bg-[#FAF7F2]/20 text-[#F4EFEB] transition">Option 5: HUD</button>
        </div>
    </header>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="flex-1 relative flex flex-col md:flex-row overflow-hidden">
        
        <!-- SIDEBAR CONTAINER (Concept target) -->
        <aside id="sidebar" class="w-full md:w-96 bg-[#FFFBF7] border-r-2 border-[#1E2A38]/20 flex flex-col h-full z-20 shadow-xl flex-shrink-0 transition-all duration-300">
            
            <!-- Logo Header -->
            <div class="p-4 border-b-2 border-[#1E2A38]/10 flex flex-col items-center justify-center bg-[#FAF7F2] text-center relative">
                <div class="absolute right-4 top-4">
                    <button onclick="toggleUnits()" class="px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider rounded-lg bg-[#1E2A38] text-[#F4EFEB] hover:bg-[#374151] transition">
                        Metric
                    </button>
                </div>
                <img src="https://raw.githubusercontent.com/username/repo/main/logo.png" alt="Wainwright Bagger Logo" class="w-20 h-20 rounded-full border-4 border-[#1E2A38] shadow-md mb-2 mt-1">
                <h1 class="font-extrabold text-xl text-[#1E2A38] brand-font">Wainwright Bagger</h1>
                <p class="text-xs text-[#1E2A38]/70">Your Fell Tracker</p>
                <span class="mt-1 text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-[#1E2A38]/10 text-[#1E2A38]">v1.5.0</span>
            </div>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 pb-16">
                <!-- Dashboard stats go here... -->
                <p class="text-xs text-[#1E2A38]/70 italic">Select a design concept using the switcher at the top to change the layout!</p>
            </div>
        </aside>

        <!-- MAP CONTAINER -->
        <main id="map-container" class="flex-1 relative h-full bg-[#F4EFEB]">
            <div id="map" class="w-full h-full z-0"></div>
        </main>

    </div>

    <script>
        let map;
        let baggedLayerGroup = L.layerGroup();
        let unvisitedLayerGroup = L.layerGroup();

        // Sample Data for Live Demo
        const wainwrights = [
            { name: "Scafell Pike", lat: 54.4543, lng: -3.2117 },
            { name: "Helvellyn", lat: 54.5270, lng: -3.0175 },
            { name: "Skiddaw", lat: 54.6514, lng: -3.1478 },
            { name: "Catbells", lat: 54.5683, lng: -3.1707 }
        ];

        window.onload = function() {
            initMap();
            plotFellsOnMap();
            setUIConcept(1); // Load Concept 1 by default
        };

        function setUIConcept(conceptNumber) {
            const sidebar = document.getElementById('sidebar');
            const wrapper = document.getElementById('app-wrapper');
            const mapContainer = document.getElementById('map-container');

            // Reset Active Button Styling
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`btn-concept-${i}`);
                btn.className = (i === conceptNumber) 
                    ? "px-3 py-1 rounded-lg font-bold bg-amber-500 text-black transition shadow-sm"
                    : "px-3 py-1 rounded-lg font-bold bg-[#FAF7F2]/10 hover:bg-[#FAF7F2]/20 text-[#F4EFEB] transition";
            }

            // Reset layout defaults
            sidebar.className = "w-full md:w-96 bg-[#FFFBF7] border-r-2 border-[#1E2A38]/20 flex flex-col h-full z-20 shadow-xl flex-shrink-0 transition-all duration-300";
            wrapper.className = "flex-1 relative flex flex-col md:flex-row overflow-hidden";

            if (conceptNumber === 1) {
                // Concept 1: Top-Bar Command Center
                sidebar.classList.add('hidden', 'md:block');
            } else if (conceptNumber === 2) {
                // Concept 2: Bottom Sheet Drawer Style
                sidebar.className = "w-full h-80 fixed bottom-0 left-0 right-0 bg-[#FFFBF7] border-t-4 border-[#1E2A38] z-30 shadow-2xl rounded-t-2xl transition-all duration-300";
            } else if (conceptNumber === 3) {
                // Concept 3: Compact Dual Grid Split
                sidebar.className = "w-full md:w-[420px] bg-[#FFFBF7] border-r-2 border-[#1E2A38]/30 flex flex-col h-full z-20 shadow-xl flex-shrink-0";
            } else if (conceptNumber === 4) {
                // Concept 4: Vintage Field Journal (Heritage Look)
                sidebar.className = "w-full md:w-96 bg-[#FAF7F2] border-r-4 border-amber-900 flex flex-col h-full z-20 shadow-2xl flex-shrink-0";
            } else if (conceptNumber === 5) {
                // Concept 5: Floating HUD
                sidebar.className = "w-full md:w-80 absolute top-4 left-4 bottom-4 bg-[#FFFBF7]/90 backdrop-blur-sm border-2 border-[#1E2A38] z-30 shadow-2xl rounded-2xl flex flex-col overflow-hidden";
            }

            setTimeout(() => { if (map) map.invalidateSize(); }, 200);
        }

        function initMap() {
            map = L.map('map', { center: [54.5, -3.1], zoom: 10, zoomControl: false });
            L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);
            baggedLayerGroup.addTo(map);
            unvisitedLayerGroup.addTo(map);
        }

        function plotFellsOnMap() {
            wainwrights.forEach(fell => {
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-pin pin-unvisited w-6 h-6 text-[10px]"><i class="fa-solid fa-mountain"></i></div>`,
                    iconSize: [24, 24], iconAnchor: [12, 12]
                });
                const marker = L.marker([fell.lat, fell.lng], { icon: icon }).bindPopup(`<b>${fell.name}</b>`);
                unvisitedLayerGroup.addLayer(marker);
            });
        }
    </script>
</body>
</html>
