<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wainwright Bagger — Lake District Fell Tracker</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E2A38">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #1E2A38; color: #1E2A38; overflow: hidden; }
        h1, h2, h3, h4, .brand-font { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #EAE3DC; }
        ::-webkit-scrollbar-thumb { background: #1E2A38; border-radius: 4px; }

        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid #FFFBF7;
        }
        .pin-bagged { background-color: #5B7B7A; }
        .pin-near { background-color: #D49B53; }
        .pin-planned { background-color: #9333ea; }
        .pin-unvisited { background-color: #94a3b8; opacity: 0.8; }

        #explore-drawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Achievement Banner Slide Animation */
        #celebration-banner {
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col">

    <!-- FULL SCREEN MAP BACKDROP -->
    <main class="absolute inset-0 z-0">
        <div id="map" class="w-full h-full"></div>
    </main>

    <!-- ACHIEVEMENT POP-UP BANNER -->
    <div id="celebration-banner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none transform -translate-y-32 opacity-0 w-[90%] max-w-sm">
        <div class="bg-[#1E2A38] text-[#FFFBF7] border-2 border-[#D49B53] rounded-2xl p-3.5 shadow-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#D49B53] text-[#1E2A38] flex items-center justify-center font-extrabold text-lg flex-shrink-0 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div class="flex-1">
                <span class="text-[10px] font-bold text-[#D49B53] uppercase tracking-wider brand-font block">Summit Bagged!</span>
                <h3 id="celebration-title" class="text-sm font-extrabold brand-font leading-tight text-[#FFFBF7]">Scafell Pike</h3>
                <p id="celebration-subtitle" class="text-[11px] text-[#FFFBF7]/80 font-medium">978m • Southern Region</p>
            </div>
        </div>
    </div>

    <!-- FLOATING TOP HEADER BAR (Minimal HUD) -->
    <header class="absolute top-3 left-3 right-3 z-20 flex items-center justify-between pointer
